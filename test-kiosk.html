<!DOCTYPE html>
<html lang="id">
<head>
  <!-- designed by alfathaannn.id -->
  <meta charset="UTF-8">
  <meta name="author" content="alfathaannn.id">
  <title>Simulasi POS Customer Display / Kiosk</title>
  <style>
    /* designed by alfathaannn.id */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    /* designed by alfathaannn.id */
    .badge {
      background: #3b82f6;
      color: white;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      display: inline-block;
    }
    h1 {
      font-size: 38px;
      margin: 0 0 10px 0;
      color: #60a5fa;
    }
    p {
      font-size: 18px;
      color: #94a3b8;
      max-width: 600px;
      line-height: 1.6;
    }
    /* designed by alfathaannn.id */
    .card {
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px 32px;
      backdrop-filter: blur(10px);
    }
    .price {
      font-size: 48px;
      font-weight: 800;
      color: #10b981;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <!-- designed by alfathaannn.id -->
  <div class="badge">POS CUSTOMER FACING DISPLAY</div>
  <h1>Selamat Datang di Kasir Kami</h1>
  <p>Halaman ini adalah simulasi tampilan layar sekunder / customer display untuk menguji ekstensi Auto Display Manager.</p>

  <!-- designed by alfathaannn.id -->
  <div class="card">
    <div style="font-size: 16px; color: #cbd5e1;">Total Belanja:</div>
    <div class="price">Rp 125.000,-</div>
    <div style="font-size: 14px; color: #64748b;">Silakan tap kartu atau scan QRIS pada terminal</div>
  </div>
</body>
</html>
